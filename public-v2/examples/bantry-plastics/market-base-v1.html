<!DOCTYPE html>

<head>

  <meta name="description" content="Machined, formed, and finished plastic parts for prototype and production. O'Fallon, Missouri." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="market-base-v1.css" />

<body>
  <header class="site-header">
    <div class="header-inner">
      <a class="logo-link" href="#" aria-label="Bantry Plastics home">
        <img src="images/logo.png" alt="Bantry Plastics" class="logo-img" />
      </a>
      <button class="menu-toggle" type="button" aria-expanded="false" aria-label="Open menu">Menu</button>
      <nav class="site-nav" aria-label="Primary">
        <a href="#work">Work</a>
        <a href="#contact">Contact</a>
      </nav>
      <div class="header-cta">
        <a class="header-phone" href="tel:+16362721398">(636) 272-1398</a>
        <a class="btn btn-primary" href="mailto:sales@bantryplastics.com">Request a Quote</a>
      </div>
    </div>

  <main>
    <section class="hero-gallery" id="work">
      <div class="hero-copy">
        <h1>Custom Plastic Fabrication</h1>

        <div class="hero-actions">

          <img src="images/gallery-1.jpg" alt="Precision machined plastic components and multi-ported cylindrical parts" />
        </figure>
        <figure class="gallery-item"><img src="images/automotive-part.jpg" alt="Custom white plastic components" /></figure>
        <figure class="gallery-item"><img src="images/gallery-5.jpg" alt="Clear acrylic enclosures with hinges and lock" /></figure>
        <figure class="gallery-item"><img src="images/medical-1.jpg" alt="Clear plastic display case with handle and lock" /></figure>
        <figure class="gallery-item"><img src="images/gallery-3.jpg" alt="Custom beverage display and coffee pod stand" /></figure>
        <figure class="gallery-item"><img src="images/gallery-7.jpg" alt="Multi-tier acrylic display stand" /></figure>
      </div>
    </section>

    <section class="contact-strip" id="contact">
      <div class="contact-inner">
        <p class="contact-address">74 N. Central Dr., O'Fallon, MO 63366</p>
        <a class="contact-email" href="mailto:sales@bantryplastics.com">sales@bantryplastics.com</a>
        <a class="contact-phone" href="tel:+16362721398">(636) 272-1398</a>
